<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal MMA - Contacto</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Arial Black', sans-serif;
        }
        .navbar-brand {
            font-size: 1.8rem;
            letter-spacing: 2px;
        }
        .nav-link {
            text-transform: uppercase;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .card-contact {
            background-color: #121212;
            border: 1px solid #222;
        }
        .form-control {
            background-color: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 0;
        }
        .form-control:focus {
            background-color: #1a1a1a;
            color: #fff;
            border-color: #d20a0a;
            box-shadow: none;
        }
        .form-label {
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
        .btn-ufc {
            background-color: #d20a0a;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 0;
            text-transform: uppercase;
            padding: 12px;
        }
        .btn-ufc:hover {
            background-color: #b00808;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Navbar Estilo UFC -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-danger">
        <div class="container">
            <a class="navbar-brand fw-bold text-danger" href="index.html">PORTAL <span class="text-white">MMA</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav gap-3">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="eventos.html">Eventos</a></li>
                    <li class="nav-item"><a class="nav-link" href="noticias.html">Noticias</a></li>
                    <li class="nav-item"><a class="nav-link" href="peleadores.html">Peleadores</a></li>
                    <li class="nav-item"><a class="nav-link active text-danger" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Contacto -->
    <main class="container my-5" style="max-width: 650px;">
        <h1 class="text-uppercase fw-bold mb-4 border-start border-danger border-4 ps-3">PONTE EN CONTACTO</h1>

        <div class="card card-contact shadow p-4 text-white">
            <form onsubmit="enviarFormulario(event)">
                <div class="mb-3">
                    <label for="nombre" class="form-label text-muted">Nombre</label>
                    <input type="text" class="form-control" id="nombre" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label text-muted">Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="mensaje" class="form-label text-muted">Mensaje</label>
                    <textarea class="form-control" id="mensaje" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn btn-ufc w-100 mt-2">ENVIAR MENSAJE</button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-black text-center py-4 mt-5 border-top border-secondary">
        <p class="mb-0 text-muted">&copy; 2026 Portal de MMA. Todos los derechos reservados.</p>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    
    <script>
        function enviarFormulario(event) {
            event.preventDefault();
            alert("¡Mensaje enviado con éxito! Nos pondremos en contacto pronto.");
            event.target.reset();
        }
    </script>
</body>
</html>
